services:
  db:
    image: postgres:16
    container_name: minipos-db
    environment:
      POSTGRES_DB: minipos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - minipos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d minipos"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  minipos_pgdata:
